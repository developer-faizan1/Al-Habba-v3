<!doctype html>

  <head>

    <!-- owl -->

    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/components.css" />

    <script src="./js/main.js" defer></script>

    <style>
      /* FULL-SCREEN HERO */
      .hero-video {
        position: relative;
        width: 100%;
        height: 100vh;
        height: 100svh;
        min-height: 450px;
        overflow: hidden;
        isolation: isolate;
        background: #18201f;
      }

      /* VIMEO VIDEO */
      .hero-iframe {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 177.78vh;
        height: 100vh;
        min-width: 100%;
        min-height: 56.25vw;
        transform: translate(-50%, -50%);
        border: 0;
        z-index: 1;
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <!-- Nav -->
    <header>
      <div class="hero-video" id="heroVideo">
        <!-- Your Vimeo video -->
        <iframe
          class="hero-iframe"
          src="https://player.vimeo.com/video/1242740480?background=1&autoplay=1&loop=1&autopause=0"
          title="Al Habbai Promo"
          allow="autoplay; fullscreen; picture-in-picture"

        <div class="container">
          <nav>
            <a href="index.html">
              <img src="./assets/images/alhabbai-white-logo.png" alt="Logo" />
            </a>

            <div class="nav-links" id="navLinks">
              <!-- Close Icon -->
              <svg
                class="svgColor"
                onclick="hideMenu()"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"

                <line x1="18" y1="6" x2="6" y2="18" />

              <ul>

                <li><a href="./principals.html">Principals</a></li>
                <li><a href="./careers.html">Careers</a></li>
                <li><a href="./contact.html">Contact</a></li>
              </ul>
            </div>

            <!-- Menu Icon -->

            <svg
              onclick="showMenu()"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="3" y1="12" x2="21" y2="12" />

    <!-- Gmail -->
    <a
      href="mailto:ahmadfaizanweb@gmail.com"
      class="floating-mail"
      aria-label="Send email"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2-2-2z"

      <svg class="progress-ring" viewBox="0 0 50 50">
        <circle class="progress-ring-bg" cx="25" cy="25" r="21" />

        <circle
          class="progress-ring-progress"
          id="progressRing"
          cx="25"
          cy="25"
          r="21"
        />
      </svg>

      <span class="scroll-arrow">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="30"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="12" y1="19" x2="12" y2="5" />

    <!-- =========================================
     OWL CAROUSEL INITIALIZATION
========================================= -->

    <script>
      $(document).ready(function () {
        $(".management-carousel").owlCarousel({
          loop: true,
          margin: 20,
          nav: true,
          dots: true,
          autoplay: true,
          autoplayTimeout: 4000,
          autoplayHoverPause: true,
          smartSpeed: 700,
          responsive: {
            0: {
              items: 1,
            },

            600: {
              items: 1,
            },

            900: {
              items: 2,
            },

            1200: {
              items: 2,
            },
          },
        });
      });
    </script>
